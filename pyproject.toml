[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-accounting"
version = "0.9.32"
description = "Offline desktop bookkeeping: import bank statements, categorize transactions, produce financial statements."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pypdfium2>=4",
    "rapidocr-onnxruntime==1.2.3",  # offline OCR for scanned PDF statements
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
am-accounting = "am_accounting.__main__:main"

[tool.setuptools.packages.find]
include = ["am_accounting*"]

[tool.setuptools.package-data]
am_accounting = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
